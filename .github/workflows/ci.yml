name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - run: composer install --no-interaction
      - name: Code style
        run: composer cs
      - name: PHPStan
        run: composer stan
      - name: Unit tests
        run: composer test

  lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          coverage: none
      - run: composer update --no-interaction --prefer-lowest --prefer-stable
      - name: Lint every file
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Unit tests
        run: composer test

  mftf-4-7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          coverage: none
      - name: Pin what MFTF 4.7 locks
        run: composer require --no-update codeception/codeception:5.0.13 codeception/module-webdriver:3.2.1 codeception/lib-web:1.0.4 codeception/lib-asserts:2.1.0 codeception/stub:4.1.2 behat/gherkin:4.9.0 php-webdriver/webdriver:1.15.1
      - run: composer update --no-interaction
      - name: Unit tests
        run: composer test
      - name: Locate the runner's drivers
        run: |
          echo "CHROMEDRIVER=$CHROMEWEBDRIVER/chromedriver" >> "$GITHUB_ENV"
          echo "GECKODRIVER=$GECKOWEBDRIVER/geckodriver" >> "$GITHUB_ENV"
      - run: composer test:integration

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - run: composer install --no-interaction
      - name: Locate the runner's drivers
        run: |
          echo "CHROMEDRIVER=$CHROMEWEBDRIVER/chromedriver" >> "$GITHUB_ENV"
          echo "GECKODRIVER=$GECKOWEBDRIVER/geckodriver" >> "$GITHUB_ENV"
      - run: composer test:integration
